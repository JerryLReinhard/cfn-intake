<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening CFN intake form | Clean Fuels National</title>
<noscript><meta http-equiv="refresh" content="0; url=https://orlando-vol-fire-scene.trycloudflare.com/wes"></noscript>
<style>
:root{--navy:#0b2f5b;--sky:#4db8e8;--slate:#f7f9fc;--gray:#6b7280;--warn:#fff7ed;--warnb:#fdba74}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--slate);color:#1a1a1a;
display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-top:6px solid var(--navy);border-radius:12px;box-shadow:0 6px 24px rgba(11,47,91,.12);max-width:460px;width:100%;padding:28px 26px;text-align:center}
img{max-width:220px;height:auto;margin-bottom:10px}
h1{font-size:20px;color:var(--navy);margin:8px 0 6px}
p{color:var(--gray);font-size:15px;line-height:1.45;margin:8px 0}
.spin{width:28px;height:28px;border:3px solid #e5e7eb;border-top-color:var(--sky);border-radius:50%;margin:14px auto;animation:s 0.9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
a.btn{display:inline-block;margin:8px 6px 0;padding:11px 18px;background:var(--navy);color:#fff;border-radius:8px;text-decoration:none;font-weight:600}
a.btn.alt{background:var(--sky)}
.warn{display:none;background:var(--warn);border:1px solid var(--warnb);border-radius:8px;padding:10px 12px;color:#7c2d12;font-size:14px;margin-top:14px}
</style>
</head><body>
<div class="card">
<img src="/cfn-intake/logo.png" alt="Clean Fuels National">
<h1>Opening CFN intake form&hellip;</h1>
<div class="spin" id="spin"></div>
<p>Pre-Quote Site &amp; Tank Intake (Wes Brown). If it doesn't open in a few seconds, tap below.</p>
<a class="btn" href="#" data-path="/wes">Open the intake form</a>
<div class="warn" id="warn">The link is updating. Please try again in a minute. This page will keep trying on its own.</div>
</div>
<script>
(function(){
  var FALLBACK_BASE = "https://orlando-vol-fire-scene.trycloudflare.com";
  var PATH = "/wes";            // "" for chooser page
  var OWNER = "JerryLReinhard", REPO = "cfn-intake";
  var qs = location.search || "", hash = location.hash || "";
  function dest(base){ return base.replace(/\/+$/,"") + PATH + qs + hash; }
  function setLinks(base){
    var els = document.querySelectorAll("[data-path]");
    for (var i=0;i<els.length;i++){ els[i].href = base.replace(/\/+$/,"") + els[i].getAttribute("data-path") + qs + hash; }
  }
  function timeout(ms){ return new Promise(function(_,rej){ setTimeout(function(){rej(new Error("timeout"))}, ms); }); }
  function getJSON(url, opts){
    return Promise.race([fetch(url, opts).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }), timeout(3500)]);
  }
  function currentBase(){
    var t = Date.now();
    // 1) GitHub contents API: reflects a commit within seconds (60 req/hr/IP unauthenticated).
    return getJSON("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/url.json?ref=main&t="+t,
                   {cache:"no-store", headers:{"Accept":"application/vnd.github.raw+json"}})
      // 2) raw.githubusercontent (cache-busted; CDN max-age ~5 min)
      .catch(function(){ return getJSON("https://raw.githubusercontent.com/"+OWNER+"/"+REPO+"/main/url.json?t="+t, {cache:"no-store"}); })
      // 3) Pages copy of url.json (CDN ~10 min)
      .catch(function(){ return getJSON("/cfn-intake/url.json?t="+t, {cache:"no-store"}); })
      .then(function(j){ if(j && /^https:\/\//.test(j.base)) return j.base; throw new Error("bad"); })
      .catch(function(){ return FALLBACK_BASE; });
  }
  function healthy(base){
    return getJSON(base.replace(/\/+$/,"") + "/health?t=" + Date.now(), {cache:"no-store"})
      .then(function(j){ return !!(j && j.ok); }).catch(function(){ return false; });
  }
  var tries = 0;
  function go(){
    tries++;
    currentBase().then(function(base){
      setLinks(base);
      healthy(base).then(function(ok){
        if (ok) { if (PATH) location.replace(dest(base)); else document.getElementById("spin") && (document.getElementById("spin").style.display="none"); return; }
        document.getElementById("warn").style.display = "block";
        if (tries < 40) setTimeout(go, 15000);
      });
    });
  }
  setLinks(FALLBACK_BASE);
  go();
})();
</script>
</body></html>
